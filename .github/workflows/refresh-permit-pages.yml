name: Refresh permit pages

# Rebuilds /permits/ from the cities' open-data feeds every Monday (and once
# right after the page code changes), commits the new pages, asks GitHub Pages
# to publish them, and tells IndexNow search engines. Run it by hand from the
# Actions tab with "Run workflow".
on:
  schedule:
    - cron: "37 13 * * 1"
  push:
    branches: [main]
    paths: ["tools/permits/**", ".github/workflows/refresh-permit-pages.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-permit-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild pages from the open-data feeds
        run: python3 tools/permits/build.py

      - name: Commit the new pages
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- permits sitemap.xml)" ]; then
            echo "No changes this week."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A permits sitemap.xml
          git commit -m "Refresh permit pages for the week of $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the workflow token don't start a Pages build on their
      # own, so request one.
      - name: Publish to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "Pages build request was refused; the site updates on the next push."

      - name: Notify IndexNow
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          sleep 120
          python3 tools/permits/indexnow.py
